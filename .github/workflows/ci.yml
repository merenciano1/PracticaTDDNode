name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Install deps (lockfile)
        run: npm ci

      - name: Run tests
        run: npm run test